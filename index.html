g:0 20px 70px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.card{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 8px 30px #4d2d180c;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.photo{height:235px;background:center/cover;position:relative}.tag{position:absolute;left:14px;top:14px;background:#fffffff0;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}.heart{position:absolute;right:14px;top:14px;border:0;background:#fffffff0;width:42px;height:42px;border-radius:50%;font-size:21px;color:#9b8b80}.heart.on{color:var(--red)}.body{padding:18px}.body h2{font-size:21px;margin:0 0 8px}.meta{font-size:13px;color:var(--muted);margin-bottom:12px}.body p{color:var(--muted);line-height:1.55;margin:0 0 16px}.open{width:100%;border:0;background:#f4e8de;border-radius:13px;padding:12px;font-weight:800}.modal{display:none;position:fixed;inset:0;z-index:30;background:#241914b8;padding:18px;overflow:auto}.modal.show{display:flex;align-items:center;justify-content:center}.dialog{width:min(950px,100%);background:var(--bg);border-radius:28px;overflow:hidden}.big{height:330px;background:center/cover;position:relative}.close{position:absolute;right:15px;top:15px;border:0;background:#fffffff0;width:45px;height:45px;border-radius:50%;font-size:25px}.detail{padding:28px}.detail h2{font-size:38px;letter-spacing:-1.5px}.intro{color:var(--muted);line-height:1.65}.cols{display:grid;grid-template-columns:.8fr 1.2fr;gap:22px;margin-top:24px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}.panel h3{margin-top:0}.panel li{line-height:1.7;margin-bottom:8px}.actions{margin-top:20px;display:flex;gap:9px}.actions button{border:0;border-radius:12px;padding:12px 16px;font-weight:800}.primary{background:var(--red);color:#fff}.secondary{background:#eee1d7}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px}@media(max-width:900px){.hero{grid-templ </style></head><body><header><nav><div class="logo">Вкусно<span>.</span></div><button onclick="favoritesOnly()">♡ Избранное</button><button onclick="randomRecipe()">🎲 Случайный рецепт</button></nav></header><section class="hero"><div><h1>Что приготовим<br>сегодня?</h1><p>Большая подборка домашних блюд с подробными рецептами и фотографиями именно того блюда, которое указано в названии.</p><div class="search"><input id="q" placeholder="Найти: паста, суп, курица..." oninput="render()"><button onclick="q.focus()">Найти</button></div></div><div class="heroimg"></div></section><div class="controls"><button class="chip active" onclick="setCat('Все',this)">Все</button><button class="chip" onclick="setCat('Завтраки',this)">Завтраки</button><button class="chip" onclick="setCat('Супы',this)">Супы</button><button class="chip" onclick="setCat('Основные',this)">Основные</button><button class="chip" onclick="setCat('Салаты',this)">Салаты</button><button class="chip" onclick="setCat('Десерты',this)">Десерты</button><select id="sort" onchange="render()"><option value="popular">Сначала популярные</option><option value="fast">Самые быстрые</option><option value="name">По названию</option></select></div><main id="grid" class="grid"></main><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="dialog"><div id="big" class="big"><button class="close" onclick="closeModal()">×</button></div><div id="detail" class="detail"></div></div></div><script>
const R=[
['Сырный суп-пюре','Супы',40,'https://images.unsplash.com/photo-1642255485002-1952ee6b6fd5?auto=format&fit=crop&w=1200&q=85','Нежный сырный суп-пюре с картофелем и золотистыми гренками.',['Картофель — 4 шт.','Морковь — 1 шт.','Лук — 1 шт.','Плавленый сыр — 180 г','Бульон — 1 л','Масло — 20 г','Соль и перец','Гренки и зелень'],['Обжарьте лук на масле до мягкости.','Добавьте морковь и картофель, залейте бульоном и варите около 20 минут.','Пробейте овощи блендером до полностью гладкой консистенции.','Добавьте сыр и прогрейте на слабом огне до полного растворения.','Посолите, поперчите и подавайте с хрустящими гренками.']],
['Паста с курицей в томатно-сливочном соусе','Основные',35,'https://ovenharmony.com/assets/images/1763215461360-s74f5li8.webp','Пенне с сочной курицей, густым соусом, пармезаном и базиликом.',['Паста — 250 г','Куриное филе — 350 г','Томаты — 300 г','Сливки — 100 мл','Лук — 1 шт.','Чеснок — 2 зубчика','Пармезан — 40 г','Базилик, масло, соль, перец'],['Сварите пасту al dente и сохраните немного воды от варки.','Курицу нарежьте и обжарьте до румяной корочки.','Обжарьте лук и чеснок, добавьте томаты и тушите 8–10 минут.','Влейте сливки, добавьте пармезан и перемешайте до густого соуса.','Верните курицу и пасту, при необходимости добавьте воду от пасты.','Посыпьте базиликом и пармезаном.']],
['Курица с картошкой и чесноком в духовке','Основные',65,'https://mcxhoreca.vtexassets.com/arquivos/ids/172702-800-800?aspect=true&height=800&v=638938021228230000&width=800','Румяная курица с запечённым картофелем, чесноком и травами.',['Куриные бёдра или голени — 700 г','Картофель — 700 г','Чеснок — 4 зубчика','Масло — 2 ст. л.','Паприка — 1 ч. л.','Сухие травы — 1 ч. л.','Соль и перец'],['Разогрейте духовку до 200°C.','Картофель нарежьте крупными дольками, курицу обсушите.','Смешайте масло, паприку, травы, соль, перец и чеснок.','Перемешайте с этой смесью картофель и курицу.','Запекайте в один слой 45–55 минут до золотистой корочки.','Дайте блюду постоять 5 минут перед подачей.']],
['Цезарь с курицей и хрустящими гренками','Салаты',30,'https://radiotrek.rv.ua/uploads/media/47/7d/477da9f01e7e7229f84baceed6cfa732_orig.jpg','Румяная курица, салат романо, гренки, пармезан и сливочная заправка.',['Куриное филе — 300 г','Романо или айсберг','Белый хлеб — 2 ломтика','Пармезан — 40 г','Майонез — 2 ст. л.','Горчица — 1 ч. л.','Лимонный сок','Чеснок'],['Курицу посолите, поперчите и обжарьте до готовности.','Хлеб нарежьте кубиками и подсушите до хруста.','Смешайте майонез, горчицу, лимонный сок и чеснок.','Листья салата обсушите и порвите руками.','Смешайте салат с заправкой, сверху выложите курицу и гренки.','Посыпьте пармезаном.']],
['Шарлотка с яблоками','Десерты',55,'https://lesbonnesrecettes.fr/images/seo/recette/charlotte-aux-pommes-fondante-et-gourmande-13414.webp','Ароматная яблочная шарлотка с мягким воздушным тестом и корицей.',['Яблоки — 4–5 шт.','Яйца — 3 шт.','Сахар — 150 г','Мука — 150 г','Разрыхлитель — 1 ч. л.','Корица','Сливочное масло'],['Разогрейте духовку до 180°C и смажьте форму.','Яблоки нарежьте дольками.','Взбейте яйца с сахаром 5–7 минут до пышной светлой массы.','Аккуратно вмешайте муку с разрыхлителем.','Выложите яблоки, залейте тестом и добавьте яблоки сверху.','Выпекайте 35–45 минут, первые 30 минут духовку не открывайте.']],
['Сырники с ягодами и сметаной','Завтраки',25,'https://spooncheck.com/images/dishes/photos/syrniki.png','Нежные творожные сырники с золотистой корочкой, ягодами и сметаной.',['Творог 5–9% — 400 г','Яйцо — 1 шт.','Сахар — 2 ст. л.','Мука — 3 ст. л.','Ванильный сахар','Соль','Масло','Сметана и ягоды'],['Разомните творог и при необходимости отожмите лишнюю влагу.','Добавьте яйцо, сахар, ванильный сахар и соль.','Всыпьте муку и быстро перемешайте.','Сформируйте небольшие сырники.','Жарьте по 3–4 минуты с каждой стороны на среднем огне.','Подавайте горячими со сметаной и ягодами.']],
['Греческий салат','Салаты',15,'https://taverna-olive.de/static/img/slider-7.jpg','Свежие овощи, маслины и фета с ароматной заправкой.',['Помидоры — 3 шт.','Огурцы — 2 шт.','Сладкий перец — 1 шт.','Красный лук — 1/2 шт.','Фета — 150 г','Маслины — 80 г','Оливковое масло — 2 ст. л.','Лимонный сок и орегано'],['Нарежьте помидоры и огурцы крупными кусочками.','Перец нарежьте полосками, лук — тонкими полукольцами.','Добавьте маслины и аккуратно перемешайте.','Выложите сверху крупные кусочки феты.','Смешайте масло, лимонный сок и орегано и полейте перед подачей.']],
['Борщ домашний со сметаной','Супы',100,'https://static.mk.ru/upload/entities/2026/09/01/18/articles/facebookPicture/4a/1e/82/e5/e1a37466ffe1499f33b2e7388fb4b276.jpg','Насыщенный домашний борщ с говядиной, свёклой, капустой и сметаной.',['Говядина на кости — 500 г','Свёкла — 1 шт.','Капуста — 300 г','Картофель — 3 шт.','Морковь — 1 шт.','Лук — 1 шт.','Томатная паста — 1,5 ст. л.','Сметана'],['Залейте мясо холодной водой, доведите до кипения и снимите пену. Варите 60–70 минут.','Достаньте мясо и процедите бульон при необходимости.','Добавьте картофель и капусту.','Отдельно обжарьте лук, морковь и свёклу с томатной пастой.','Переложите зажарку в кастрюлю и верните мясо.','Варите ещё 10–15 минут и дайте настояться минимум 20 минут.']],
['Шоколадный торт','Десерты',60,'https://essenrezept.de/wp-content/uploads/2021/01/Schoko-Kuchen-1024x939.png','Влажный шоколадный бисквит с насыщенным шоколадным кремом.',['Мука — 180 г','Какао — 40 г','Сахар — 160 г','Яйца — 2 шт.','Молоко — 140 мл','Масло — 80 мл','Разрыхлитель','Шоколад — 100 г'],['Смешайте муку, какао, разрыхлитель и сахар.','Отдельно смешайте яйца, молоко и масло.','Соедините смеси и перемешайте до однородности.','Выпекайте при 180°C около 30–35 минут.','Растопите шоколад со сливочным маслом и остудите.','Разрежьте корж, промажьте кремом и соберите торт.']],
['Панкейки с бананом и ягодами','Завтраки',20,'https://images.news.ru/2026/03/25/clCWEiFFoCp1R689duB1J1rzj123vuh4dNXij6PA_1200.png','Пышные банановые панкейки с ягодами и золотистым сиропом.',['Банан — 1 шт.','Яйцо — 1 шт.','Молоко — 150 мл','Мука — 150 г','Разрыхлитель — 1 ч. л.','Сахар — 1 ст. л.','Соль','Ягоды и сироп'],['Разомните банан.','Добавьте яйцо и молоко.','Всыпьте муку, сахар, разрыхлитель и соль.','Жарьте небольшие панкейки на среднем огне.','Переворачивайте после появления пузырьков.','Подавайте стопкой с бананом, ягодами и сиропом.']],
['Запечённый лосось с лимоном','Основные',30,'https://snapcalorie-webflow-website.s3.us-east-2.amazonaws.com/media/recipe_pics_v2/medium/lemon_herb_baked_salmon.jpg','Нежный лосось, запечённый с лимоном, чесноком и зеленью.',['Филе лосося — 500 г','Лимон — 1/2 шт.','Чеснок — 2 зубчика','Оливковое масло — 1,5 ст. л.','Сухие травы','Соль и перец'],['Разогрейте духовку до 200°C.','Обсушите филе, посолите и поперчите.','Смажьте маслом, добавьте чеснок и травы.','Разложите тонкие ломтики лимона.','Запекайте 15–20 минут.','Перед подачей добавьте немного свежего лимонного сока.']],
['Бефстроганов с картофельным пюре','Основные',50,'https://cdn.prod.website-files.com/65e2ec4e51f6693a3af9151d/660ea9318f2951604251bba0_660ea8c15b39784f4a08aac1_86c1e90d-e56b-40d5-bf94-0fd8298eb656%20%281%29.webp','Нежная говядина с грибами в сливочном соусе на воздушном пюре.',['Говядина — 500 г','Шампиньоны — 250 г','Лук — 1 шт.','Бульон — 200 мл','Сметана — 150 г','Горчица — 1 ч. л.','Картофель — 600 г','Молоко и масло'],['Картофель отварите до мягкости.','Говядину нарежьте тонкими полосками и быстро обжарьте.','Обжарьте лук и грибы до золотистого цвета.','Добавьте бульон и горчицу, немного выпарите.','Убавьте огонь, вмешайте сметану и верните мясо.','Картофель разомните с маслом и тёплым молоком.']],
['Пельмени со сметаной и укропом','Основные',35,'https://recipeworld.blog/recipes/pelmeni-step-5.webp','Горячие пельмени с маслом, сметаной и свежим укропом.',['Пельмени — 500 г','Вода — 2 л','Соль','Лавровый лист','Сливочное масло — 20 г','Сметана','Укроп','Перец'],['Доведите подсоленную воду с лавровым листом до кипения.','Опускайте пельмени небольшими порциями и аккуратно перемешивайте.','После всплытия варите ещё 4–6 минут.','Достаньте шумовкой и добавьте масло.','Подавайте со сметаной, укропом и перцем.']],
['Спагетти карбонара','Основные',25,'https://cdnes.thamhiemmekong.com/2026/04/54/thumb.jpg','Кремовая карбонара с беконом, сыром и свежемолотым перцем.',['Спагетти — 250 г','Бекон — 120 г','Желтки — 3 шт.','Пармезан — 70 г','Чёрный перец','Соль'],['Сварите спагетти и сохраните воду от пасты.','Обжарьте бекон до золотистой корочки.','Смешайте желтки, сыр и много чёрного перца.','Соедините горячую пасту с беконом.','Снимите с огня и быстро вмешайте яично-сырную смесь.','Добавляйте воду по ложке до гладкого кремового соуса.']],
['Драники со сметаной','Завтраки',30,'https://imageproxy.wolt.com/assets/67335dc8f80c1126648b8056','Хрустящие картофельные драники с нежной серединой и сметаной.',['Картофель — 600 г','Лук — 1/2 шт.','Яйцо — 1 шт.','Мука — 1 ст. л.','Соль и перец','Масло','Сметана и укроп'],['Натрите картофель и хорошо отожмите жидкость.','Добавьте лук, яйцо, муку, соль и перец.','Разогрейте масло.','Выкладывайте массу тонкими лепёшками.','Жарьте по 3–4 минуты с каждой стороны.','Подавайте горячими со сметаной и укропом.']],
['Курица карри с рисом','Основные',45,'https://cookingkeys.com/assets/images/1736926395577-fdlsu0ex.webp','Нежная курица в пряном соусе с ароматным рисом.',['Куриное филе — 400 г','Рис — 200 г','Лук — 1 шт.','Чеснок — 2 зубчика','Кокосовое молоко — 200 мл','Карри — 1,5 ч. л.','Паприка','Сладкий перец'],['Сварите рис до готовности.','Курицу нарежьте и обжарьте до румяности.','Добавьте лук, чеснок и сладкий перец.','Всыпьте карри и паприку.','Влейте кокосовое молоко и тушите 10–15 минут.','Подавайте карри на рисе, добавив зелень.']],

['Маргарита','Основные',35,'https://d1w7312wesee68.cloudfront.net/0jdLn0jV16ub-Vi7UNVaUSLN3A9kj_zOTDzxBIEVxs4/resize%3Afit%3A720%3A720/plain/s3%3A/toasttab/restaurants/restaurant-195821000000000000/menu/items/4/item-1100000000252749244_1728599713.jpg','Тонкая пицца с томатным соусом, моцареллой и свежим базиликом.',['Мука — 300 г','Вода — 190 мл','Дрожжи — 5 г','Соль','Оливковое масло','Томатный соус — 120 г','Моцарелла — 150 г','Базилик'],['Замесите тесто и оставьте подниматься на 60 минут.','Разогрейте духовку вместе с противнем до максимальной температуры.','Растяните тесто в тонкий круг.','Добавьте томатный соус и моцареллу.','Выпекайте 8–12 минут.','После духовки добавьте свежий базилик.']],

let category='Все',favorites=JSON.parse(localStorage.getItem('vkfav')||'[]');const grid=document.getElementById('grid'),q=document.getElementById('q');
function fav(i){return favorites.includes(i)}function toggle(i){favorites=fav(i)?favorites.filter(x=>x!==i):[...favorites,i];localStorage.setItem('vkfav',JSON.stringify(favorites));render();if(modal.classList.contains('show'))openRecipe(i)}function setCat(c,b){category=c;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}function list(){let a=R.map((r,i)=>({...r,id:i})),s=document.getElementById('sort').value,t=q.value.toLowerCase().trim();a=a.filter(r=>(category==='Все'||r[1]===category)&&(!t||(r[0]+' '+r[1]+' '+r[4]+' '+r[5].join(' ')).toLowerCase().includes(t)));if(s==='fast')a.sort((x,y)=>x[2]-y[2]);if(s==='name')a.sort((x,y)=>x[0].localeCompare(y[0],'ru'));return a}function render(){let a=list();grid.innerHTML=a.length?a.map(r=>`<article class="card"><div class="photo" style="background-image:url('${r[3]}')"><span class="tag">${r[1]}</span><button class="heart ${fav(r.id)?'on':''}" onclick="event.stopPropagation();toggle(${r.id})">${fav(r.id)?'♥':'♡'}</button></div><div class="body"><h2>${r[0]}</h2><div class="meta">⏱ ${r[2]} мин · ${r[5].length} ингредиентов</div><p>${r[4]}</p><button class="open" onclick="openRecipe(${r.id})">Открыть подробный рецепт</button></div></article>`).join(''):`<div class="empty"><h2>Ничего не найдено</h2><p>Попробуй другой запрос.</p></div>`}function openRecipe(i){let r=R[i];big.style.backgroundImage=`url('${r[3]}')`;detail.innerHTML=`<div class="meta">${r[1]} · ⏱ ${r[2]} минут</div><h2>${r[0]}</h2><p class="intro">${r[4]} Здесь собран подробный домашний вариант с последовательными шагами и точным списком продуктов.</p><div class="cols"><section class="panel"><h3>Ингредиенты</h3><ul>${r[5].map(x=>`<li>${x}</li>`).join('')}</ul></section><section class="panel"><h3>Приготовление</h3><ol>${r[6].map(x=>`<li>${x}</li>`).join('')}</ol></section></div><div class="actions"><button class="primary" onclick="toggle(${i})">${fav(i)?'♥ В избранном':'♡ В избранное'}</button><button class="secondary" onclick="closeModal()">Закрыть</button></div>`;modal.classList.add('show');document.body.style.overflow='hidden'}function closeModal(){modal.classList.remove('show');document.body.style.overflow=''}function randomRecipe(){openRecipe(Math.floor(Math.random()*R.length))}function favoritesOnly(){category='Все';document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));document.querySelector('.chip').classList.add('active');q.value='';let a=R.map((r,i)=>({...r,id:i})).filter(r=>fav(r.id));grid.innerHTML=a.length?a.map(r=>`<article class="card"><div class="photo" style="background-image:url('${r[3]}')"><span class="tag">${r[1]}</span><button class="heart on" onclick="toggle(${r.id})">♥</button></div><div class="body"><h2>${r[0]}</h2><div class="meta">⏱ ${r[2]} мин</div><p>${r[4]}</p><button class="open" onclick="openRecipe(${r.id})">Открыть подробный рецепт</button></div></article>`).join(''):`<div class="empty"><h2>Избранное пока пусто</h2><p>Добавляй понравившиеся блюда кнопкой ♡.</p></div>`}document.addEventListener('keydown',e=>e.key==='Escape'&&closeModal());render();
</script></body></html>
